services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: asistencia_qr_web
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=asistencia_qr
      - DB_USER=root
      - DB_PASS=rootpassword
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - asistencia_net

  db:
    image: mariadb:10.6
    container_name: asistencia_qr_db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=asistencia_qr
    ports:
      - "3308:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - asistencia_net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: asistencia_qr_phpmyadmin
    restart: unless-stopped
    environment:
      - PMA_HOST=db
      - PMA_PORT=3306
      - PMA_USER=root
      - PMA_PASSWORD=rootpassword
    ports:
      - "8081:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - asistencia_net

volumes:
  mariadb_data:

networks:
  asistencia_net:
    driver: bridge
